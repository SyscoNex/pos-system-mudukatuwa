# Owner approved this isolated target and synthetic tests on 28 November 2026.
name: conex360-auth-review
services:
  mysql:
    profiles: [database-approved]
    image: mysql:8.4.13.1@sha256:8c233bad33d520a7aae1c1e619c3a9775f4a1ba2d463d692fada04ec7f40be00
    environment:
      MYSQL_DATABASE: conex360_auth_review
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets: [mysql_root_password, mysql_migration_password, mysql_runtime_password]
    volumes:
      - auth_review_mysql:/var/lib/mysql
      - ./mysql/bootstrap-accounts.sh:/docker-entrypoint-initdb.d/10-accounts.sh:ro
      - ./mysql/grant-runtime.sh:/opt/conex360/grant-runtime.sh:ro
      - ./mysql/grant-organization.sh:/opt/conex360/grant-organization.sh:ro
    command: [--general-log=OFF, --slow-query-log=OFF, --default-time-zone=+00:00, --log-bin-trust-function-creators=ON]
    expose: ["3306"]
    # Deliberately NO published ports. Tools/API run on the private project network.
    healthcheck:
      test: [CMD, mysqladmin, ping, --silent]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      com.sysconex.execution-gate: owner-approval-required
    logging:
      options: {max-size: 10m, max-file: "3"}
  tools:
    profiles: [database-approved]
    build:
      context: ..
      dockerfile: infrastructure/docker/auth-tools.Dockerfile
    working_dir: /source
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Enabled: "true"
      Database__AllowUnverifiedDevelopmentTls: "true"
      Database__ConnectionFile: /run/secrets/runtime_connection
      Database__MigrationConnectionFile: /run/secrets/migration_connection
      Operations__Enabled: "true"
      Organization__Enabled: "true"
    secrets: [runtime_connection, migration_connection, dp_certificate, dp_password]
    volumes:
      - ../artifacts/auth-review:/evidence
      - ../backend:/source/backend:ro
    depends_on:
      mysql: {condition: service_healthy}
  api:
    profiles: [runtime]
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AllowedHosts: "localhost;127.0.0.1;api"
      Authentication__Enabled: "true"
      Organization__Enabled: "true"
      Authentication__AllowInsecureDevelopmentCookies: "true"
      Authentication__AllowedOrigins__0: http://127.0.0.1:3602
      Database__Enabled: "true"
      Database__AllowUnverifiedDevelopmentTls: "true"
      Database__ConnectionFile: /run/secrets/runtime_connection
      Storage__KeyDirectory: /data/keys
      Storage__LogoDirectory: /data/logos
      Storage__CertificateFile: /run/secrets/dp_certificate
      Storage__CertificatePasswordFile: /run/secrets/dp_password
    secrets: [runtime_connection, dp_certificate, dp_password]
    volumes: [auth_review_data:/data]
    ports: ["127.0.0.1:5182:8080"]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      mysql: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
  frontend:
    profiles: [runtime]
    build:
      context: ..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    expose: ["3000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  proxy:
    profiles: [runtime]
    image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    ports: ["127.0.0.1:3602:8080"]
    volumes: ["./nginx/auth-review.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api, frontend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  storage-init:
    profiles: [runtime]
    image: mcr.microsoft.com/dotnet/aspnet:10.0.15@sha256:aac50ceef10391e78a899e3d2ccd00bbafa2dcb56ccf4586cbccf00edb84fc21
    user: root
    entrypoint: [sh, -c, 'mkdir -p /data/keys /data/logos && chown -R 1654:1654 /data && chmod 700 /data/keys /data/logos']
    volumes: [auth_review_data:/data]
volumes:
  auth_review_mysql:
  auth_review_data:
secrets:
  mysql_root_password:
    file: ../.local/auth-review/mysql-root-password
  mysql_migration_password:
    file: ../.local/auth-review/mysql-migration-password
  mysql_runtime_password:
    file: ../.local/auth-review/mysql-runtime-password
  runtime_connection:
    file: ../.local/auth-review/runtime-connection
  migration_connection:
    file: ../.local/auth-review/migration-connection
  dp_certificate:
    file: ../.local/auth-review/data-protection.pfx
  dp_password:
    file: ../.local/auth-review/dp-password
