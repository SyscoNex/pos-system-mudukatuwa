name: conex360-foundation

services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: localhost;127.0.0.1
    expose:
      - "8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options: { max-size: 10m, max-file: "3" }

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    expose:
      - "3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options: { max-size: 10m, max-file: "3" }

  proxy:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    ports:
      - "127.0.0.1:${CONEX360_HTTP_PORT:-3600}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/v1/health]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      options: { max-size: 10m, max-file: "3" }

# Intentionally no MySQL service, DB volumes, migrations or automatic bootstrap.
# All resources are isolated by the explicit Conex360 project name.
